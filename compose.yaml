name: shipwise
services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes: ['./apps/backend:/app']
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-only}
      DATABASE_URL: postgresql://shipwise:${POSTGRES_PASSWORD:-shipwise}@database:5432/shipwise?serverVersion=17&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      APP_URL: ${APP_URL:-http://localhost:8080}
      MAIL_FROM: no-reply@shipwise.local
      APP_VERSION: 0.1.0
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(is_file("/app/vendor/autoload.php") ? 0 : 1);']
      interval: 10s
      retries: 10
  frontend:
    image: node:22-bookworm-slim
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /app
    volumes: ['./apps/frontend:/app', './docs:/docs:ro']
    environment:
      npm_config_cache: /tmp/npm
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:5173").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      retries: 20
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipwise
      POSTGRES_USER: shipwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipwise}
    volumes: ['database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shipwise -d shipwise']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
  proxy:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${APP_PORT:-8080}:80']
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro', './apps/backend/public:/app/public:ro']
    depends_on: [backend, frontend]
volumes:
  database:
