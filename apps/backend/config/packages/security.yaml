security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    accounts:
      id: App\Identity\Infrastructure\AccountProvider
  firewalls:
    main:
      lazy: true
      provider: accounts
      user_checker: App\Identity\Infrastructure\AccountChecker
      json_login:
        check_path: /api/v1/auth/login
        username_path: email
        password_path: password
        success_handler: App\Identity\Infrastructure\LoginResponder
        failure_handler: App\Identity\Infrastructure\LoginResponder
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
      entry_point: App\Identity\Infrastructure\LoginResponder
  access_control:
    - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
    - { path: ^/api/v1/auth, roles: PUBLIC_ACCESS }
    - { path: ^/api/v1/admin, roles: ROLE_STAFF }
    - { path: ^/api/v1/me, roles: ROLE_USER }
