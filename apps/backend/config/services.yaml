parameters:
  env(DHL_SANDBOX_ENABLED): '0'
  env(DPD_SANDBOX_ENABLED): '0'
  env(DHL_CLIENT_ID): ''
  env(DHL_CLIENT_SECRET): ''
  env(DHL_USERNAME): ''
  env(DHL_PASSWORD): ''
  env(DHL_BILLING_NUMBER): ''
  env(DHL_PROFILE): ''
  env(DPD_DELIS_ID): ''
  env(DPD_PASSWORD): ''
  app.url: '%env(APP_URL)%'
services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $appUrl: '%app.url%'
      $mailFrom: '%env(MAIL_FROM)%'
      $version: '%env(APP_VERSION)%'
      $projectDir: '%kernel.project_dir%'
      $environment: '%kernel.environment%'
  App\:
    resource: '../src/'
    exclude: '../src/{Kernel.php,Identity/Domain/,Shared/Domain/,AccessControl/Domain/,Quoting/Domain/,Pricing/Domain/,CarrierCatalog/Domain/,CarrierIntegration/Domain/}'
  App\Identity\Application\Accounts: ~
  App\Identity\Domain\UserRepository: '@App\Identity\Infrastructure\DoctrineUserRepository'
  App\Identity\Application\TokenRepository: '@App\Identity\Infrastructure\SqlTokenRepository'
  App\Identity\Application\AccountMailer: '@App\Identity\Infrastructure\SymfonyAccountMailer'
  App\AccessControl\Application\AccessRepository: '@App\AccessControl\Infrastructure\SqlAccessRepository'
  App\Audit\Application\AuditRepository: '@App\Audit\Infrastructure\SqlAuditRepository'
  App\Shared\Application\Transactions: '@App\Shared\Infrastructure\DoctrineTransactions'
  App\Identity\Application\Passwords: '@App\Identity\Infrastructure\SymfonyPasswords'

  App\CarrierCatalog\Domain\Eligibility: ~
  App\Pricing\Domain\PriceCalculator: ~
  App\CarrierCatalog\Application\Catalog: '@App\CarrierCatalog\Infrastructure\SqlCatalog'
  App\Quoting\Application\QuoteStore: '@App\Quoting\Infrastructure\SqlQuoteStore'
  App\CarrierIntegration\Application\ProviderRegistry:
    arguments:
      $providers: ['@App\CarrierIntegration\Infrastructure\DevelopmentTariffProvider']

  App\Pricing\Application\PricingRules: '@App\Pricing\Infrastructure\SqlPricingRules'

  App\CarrierIntegration\Infrastructure\SandboxTransport:
    arguments:
      $client: null
  App\CarrierIntegration\Infrastructure\SandboxTokens:
    arguments:
      $carrierTokens: '@cache.carrier_tokens'
  App\CarrierIntegration\Infrastructure\SandboxConfiguration:
    arguments:
      $values:
        DHL_SANDBOX_ENABLED: '%env(DHL_SANDBOX_ENABLED)%'
        DPD_SANDBOX_ENABLED: '%env(DPD_SANDBOX_ENABLED)%'
        DHL_CLIENT_ID: '%env(DHL_CLIENT_ID)%'
        DHL_CLIENT_SECRET: '%env(DHL_CLIENT_SECRET)%'
        DHL_USERNAME: '%env(DHL_USERNAME)%'
        DHL_PASSWORD: '%env(DHL_PASSWORD)%'
        DHL_BILLING_NUMBER: '%env(DHL_BILLING_NUMBER)%'
        DHL_PROFILE: '%env(DHL_PROFILE)%'
        DPD_DELIS_ID: '%env(DPD_DELIS_ID)%'
        DPD_PASSWORD: '%env(DPD_PASSWORD)%'
