server {
 listen 80;
 server_name _;
 root /app/public;
 client_max_body_size 64k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8080; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME /app/public/index.php;
   fastcgi_param DOCUMENT_ROOT /app/public;
   fastcgi_param HTTP_PROXY "";
   fastcgi_pass backend:9000;
 }
 location / {
   proxy_pass http://frontend:5173;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
 }
}
